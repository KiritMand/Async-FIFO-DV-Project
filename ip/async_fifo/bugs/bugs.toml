# ---- B11
[[bug]]
id      = "B11"
patch   = "B11_full_early.patch"
title   = "wfull asserts at DEPTH-1"
[bug.predict]
static      = "no"
cdc         = "no"
sim_sb      = "stim"
sim_sva     = "stim"
formal      = "e2e"
prove       = "fail"
covers_lost = ["cov_F04_blocked_write_at_full", "cov_F12_full_reached", "cov_F12_empty_after_full",
               "cov_F16_rw_at_depth_m1", "cov_F17_full_before_rd_release"]
why = """Safe but wrong: the scoreboard sees no error, but the M4 test checks do (F12_CAPACITY,
F12_MAX_FILL, SMOKE, DRAIN_COUNT, THRASH_WEAK in thrash_full); random_rates and thrash_empty have
no capacity check. With SVA, ast_F12_capacity / ast_F08_wfull_exact fire whenever fill reaches 15
with reads paused; thrash_empty never gets there. The plan's table said "sim x"; M4's checks
changed that. Formal: every cover that needs fill = DEPTH, or a write accepted at DEPTH-1, dies."""

[bug.explain]
covers_lost = """The five predicted covers are lost, plus cov_F13_two_wraps. The cover run hits the 1800 s
time limit before step 60 (the cell shows where), so this cell is bounded. The five are real
losses: each needs fill = DEPTH, or a write accepted at fill DEPTH-1, which a full flag at DEPTH-1
forbids; rtl-v1 reaches all five by step 18, and the B11 simulations never hit the four that also
run in simulation. cov_F13_two_wraps is the same time-limit artifact as in B08: rtl-v1 needs 60
steps, and B11's passing simulations hit it 967 times."""

# ---- B12
[[bug]]
id      = "B12"
patch   = "B12_empty_reset_low.patch"
title   = "rempty resets to 0"
[bug.predict]
static      = "no"
cdc         = "no"
sim_sb      = "stim"
sim_sva     = "yes"
formal      = "e2e"
prove       = "fail"
covers_lost = []
why = """Harmful only if a read comes at the first rclk edge after release (then SB_UNDERFLOW);
otherwise rempty recovers at that edge. ast_F01_rempty_high_in_reset fires at the first rclk edge
inside reset, which every run has. Formal: ast_F01_rempty_high_in_reset at step 1."""
[bug.explain]
sim_sb = """Predicted stim; 0/140, and this is a stimulus gap the matrix found. B12 only hurts if a read
comes at the first rclk edge after reset release. The read driver decides each edge from the
previous edge's sample of rrst_n: at the release edge it still sees reset and sets req = 0, so
the first edge out of reset never carries rinc (the write driver works the same way). The UVM
stimulus therefore never exercises that edge. B12 is still caught in every run by
ast_F01_rempty_high_in_reset and by formal (free inputs). Proposed fix for the owner (not done:
it changes the stimulus, so SO-1/SO-2 would need rerunning): let the noise phase drive rinc/winc
for the first edge after release too, and add a coverage item for an attempt at that edge."""
