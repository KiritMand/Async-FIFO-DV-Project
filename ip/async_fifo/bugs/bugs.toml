# ---- B05
[[bug]]
id      = "B05"
patch   = "B05_empty_current_ptr.patch"
title   = "rempty from the current, not the next, read pointer"
[bug.predict]
static      = "no"
cdc         = "no"
sim_sb      = "stim"
sim_sva     = "stim"
formal      = "e2e"
prove       = "fail"
covers_lost = []
why = """rempty stays low one rclk edge after the last entry is read, so only a read at the very
next edge underflows: back-to-back reads down to empty (smoke and drain_to_empty read at 100%;
others when the reader is fast). SB_UNDERFLOW and ast_F07_rempty_not_optimistic fire at the same
edge. Formal: M7 saw ast_F14_rdata_stable_gclk at step 11; ast_F07 should follow."""

[bug.explain]
sim_sva = """Predicted stim, like the scoreboard (75/140): an underflow needs a read at the one rclk edge
where rempty is wrongly low. But ast_F07_rempty_not_optimistic checks the flag itself at every
rclk edge: rempty = 0 with true fill 0 fails whether or not a read comes. Every run drains to
empty after a read at least once, so every run fails (139 first caught by cast_F07, the
concurrent twin of ast_F07 in the same time step, 1 by cast_F14). Lesson: checking the flag
directly catches what checking its consequence (the scoreboard) only catches by luck."""

# ---- B06
[[bug]]
id      = "B06"
patch   = "B06_bad_gray.patch"
title   = "Gray conversion bin ^ (bin << 1)"
[bug.predict]
static      = "no"
cdc         = "no"
sim_sb      = "stim"
sim_sva     = "yes"
formal      = "e2e"
prove       = "fail"
covers_lost = []
why = """The code is a bijection, so empty works; full matches when wbin ^ rbin = 8 (ASIZE=4):
early full at fill 8, or overflow at 16. Fill-to-full tests fail (F12_CAPACITY, SMOKE), but
thrash_empty never gets near 8. With SVA the white-box ast_F10_wptr_is_gray_of_wbin and
ast_F09_wptr_cdc_one_bit fire at the first write of every run. Formal (ASIZE=2): full at fill 2,
so ast_F12_capacity (e2e) fails too."""

[bug.explain]
covers_lost = """Predicted no lost covers, without working each cover through. At ASIZE=2 the wrong code makes the
full compare match when wbin XOR rbin = 2, i.e. at fill 2 while rbin = 0. cov_F17_full_before_rd_release
needs fill = DEPTH while the reader is still in reset (rbin frozen at 0), so full stops the writer
at fill 2 and the cover is unreachable. The other 21 stay reachable."""

# ---- B07
[[bug]]
id      = "B07"
patch   = "B07_binary_crossing.patch"
title   = "Binary pointer crosses, converted to gray after the synchronizer"
[bug.predict]
static      = "no"
cdc         = "no"
sim_sb      = "no"
sim_sva     = "yes"
formal      = "white-box"
prove       = "fail"
covers_lost = []
why = """Functionally identical in zero-delay RTL: gray(sync(wbin)) == sync(gray(wbin)) when every
bit is sampled at once (plan R11). Only the source-side ast_F09_wptr_cdc_one_bit sees it, at the
second write (1 -> 2 flips two bits) of every run. Formal: the same white-box labels and no e2e
label within the bound; prove fails on invariants that read rq1/rq2 as gray."""

[bug.explain]
static = """Predicted no; caught only incidentally. With wptr_cdc driven by wbin, the gray register wptr is
read by nothing but the property file, so lint (RTL alone, -Wall) reports UNUSEDSIGNAL 'wptr'
and synth's flop count drops from 42 to 37 (opt_clean removes the 5 wptr flops). A designer who
meant to send the binary pointer would delete the gray register, and then neither check fires.
The structural CDC check passes B07 as predicted (only the R4 note), so this is not a method for B07."""

# ---- B08
[[bug]]
id      = "B08"
patch   = "B08_one_sync_stage.patch"
title   = "One synchronizer stage deleted (read -> write path)"
[bug.predict]
static      = "yes"
cdc         = "yes"
sim_sb      = "no"
sim_sva     = "no"
formal      = "no"
prove       = "fail"
covers_lost = ["cov_F08_wfull_lag_k_minus_1"]
why = """Flags stay conservative and only get one wclk edge faster, so no RTL check can fail.
Static: lint -Wall reports wq2_rptr unused, and synth's flop count drops by ASIZE+1 (opt_clean
removes the dead stage). prove fails, but only on inv_wfull_safe, an invariant written for a
two-stage design (wfull judged against wq2_rptr), not on a spec label. The lag at the K-th wclk
edge after a read disappears, so cov_F08_wfull_lag_k_minus_1 becomes unreachable. cdc: R2, stage 1
(wq1_rptr) feeds the full compare."""

[bug.explain]
prove = """Predicted fail on inv_wfull_safe; it passes. I misjudged the timing: wfull computed from
wq1_rptr falls at the same wclk edge where wq2_rptr copies wq1_rptr, so "wfull is safe against
stage 2" still holds at every step, and so does every other invariant. So formal is blind to
B08 entirely: bmc, k-induction and every spec property pass, which is plan R11 in its strongest
form. Only the lag cover changes."""
covers_lost = """Predicted only cov_F08_wfull_lag_k_minus_1. The cover run hits the 1800 s time limit in the
50s of steps (the cell shows where), so this cell is bounded. cov_F08_wfull_lag_k_minus_1 is the
real loss: rtl-v1 reaches it at step 15, B08 never does, and in simulation it has 0 hits in 140
B08 runs against 1,866 on rtl-v1. cov_F13_two_wraps is a time-limit artifact: rtl-v1 needs 60
steps for it, the B08 search does not get that far (each step's unsatisfiable query for the dead
lag cover is slow), and the B08 simulations hit it 18,688 times, so it is reachable."""

