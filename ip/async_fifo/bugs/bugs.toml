ast_F11_rsync_on_rclk. The plan's table said formal only with the white-box F11; this predicts an
e2e catch. cdc: R3 (rq1/rq2 on wclk but reset by rrst_n) and R1 (rq2 reaches the rempty flop through
the compare logic)."""

