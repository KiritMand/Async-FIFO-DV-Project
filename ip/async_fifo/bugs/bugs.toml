# bugs/bugs.toml — the planted-bug list (M8, vplan §6), read by common/scripts/bug_matrix.py.
# Predictions were written on 2026-11-25 BEFORE any bug was run; they are never edited after a
# run. Differences are explained in [bug.explain] (M8 step 3), one entry per differing cell, and
# bug_matrix.py fails while a difference has no explanation.
#
# The cdc cell was added with the structural checker (M8 step 5), before the matrix run but after
# its bring-up runs on B07-B10, so the cdc predictions for those four are not blind.
#
# Cell values. static: yes | no (make lint or make synth fails). cdc: yes | no (make cdc fails).
# sim_sb (UVM checks only, SVA=0) and sim_sva (all assertions): yes = every run of the subset
#   fails; stim = some do (the stimulus must create the scenario); no = none.
# formal (bmc_bugs, spec properties, no invariants, depth 20): e2e = an e2e label fails;
#   white-box = only white-box labels fail; no = nothing fails within the bound.
# prove (k-induction with the invariants): pass | fail (FAIL or UNKNOWN).
# covers_lost: formal covers reached on rtl-v1 but not on the bug (cover mode ignores
#   assertions, toolchain T19, so this is pure reachability).

# How the matrix runs every bug. Simulation: these regress/tests.toml ids, seeds 1..seeds, at the
# simulation size (ASIZE=4, DSIZE=8). Formal: these tasks at formal_asize (DSIZE=4).
[matrix]
tests          = ["smoke_test", "fill_to_full_test", "drain_to_empty_test", "thrash_full_test",
                  "thrash_empty_test", "random_rates_test", "random_mix_test"]
seeds          = 20
formal_asize   = 2
formal_tasks   = ["bmc_bugs", "prove", "cover"]
formal_timeout = 1800

# Conclusions written after the run, shown on the page below the summary table (Markdown).
[report]
findings = """
1. **Every bug is caught by some method; no method catches every bug.**

   | Method | Bugs caught | Missed |
   |---|---|---|
   | Simulation, UVM checks only (scoreboard and test checks) | 8 of 12 | B07, B08, B09, B12 |
   | Simulation with every assertion | 11 of 12 | B08 |
   | Formal, spec properties to depth 20 | 11 of 12 (ten through an e2e property) | B08 |
   | Structural CDC check | 2 of 12 (B08, B09) | the ten functional bugs |

   In formal, B07 fails only white-box properties. Lint and synth also flag B07 and B08, but only
   by accident: each leaves a register unread. B08 escapes every functional method, including the
   k-induction proof.
2. **Assertions on the flags turn luck into certainty.** Failing runs, UVM checks only → with
   every assertion:
   - B05: 75 → 140
   - B12: 0 → 140
   - B06: 114 → 140
   - B01: 96 → 138
   - B11: 99 → 118
   - B09: 0 → 41

   The scoreboard sees a wrong flag only when the stimulus acts on it at the wrong edge. A property
   on the flag sees the flag itself.
3. **For data-path bugs, assertions add timing, not detection.** B03, B04 and B10 fail in exactly
   the same runs with and without assertions. The assertion (`ast_F14_rdata_stable`,
   `ast_F05_blocked_read_holds_rptr`) fires earlier than the scoreboard's mismatch, which helps
   locate the bug, but finds no new failures.
4. **Regular tests can hide bugs.** B10 (memory addressed with gray bits) passes every directed
   test. Filling exactly DEPTH entries from empty keeps the live window aligned at pointer 0 or
   16, where no two live entries share a slot. B04 needs a read attempt at empty, which
   `fill_to_full_test` and `thrash_full_test` never make. The random tests carry these detections.
5. **CDC bugs are a separate class.** RTL simulation and RTL formal have no metastability.
   - B07 (binary pointer crossing) is seen only by the source-side white-box
     `ast_F09_wptr_cdc_one_bit`; no e2e property fails in simulation or in formal.
   - B08 (one synchronizer stage) is seen by nothing functional: only the structural check (R2)
     and a cover that becomes unreachable.
   - B09 (synchronizer on the source clock) shows up functionally only through a latency side
     effect: `ast_F08_rempty_exact`, in 41 of 140 runs and in formal. Its cause is found by the
     structural rules R1/R3 and the white-box `ast_F11_rsync_on_rclk`.

   See `docs/interview_notes.md` (metastability).
6. **Covers catch "safe but wrong".** `cov_F08_wfull_lag_k_minus_1` has 1,866 hits on rtl-v1 and
   none on B08. Five covers that need fill = DEPTH become unreachable on B11.
7. **Formal is the fastest finder.** At ASIZE=2, every functional bug fails `bmc_bugs` within 17
   steps (B12 at step 1), each run in minutes. `prove` fails or is inconclusive for every bug
   except B08.
8. **The matrix found a testbench gap (B12).** The first `rclk` edge after reset release never
   carries a read, because the driver sees the release one edge late. The write side works the
   same way. A fix is proposed under B12; it is the owner's decision, because it changes the
   stimulus behind SO-1/SO-2.
"""

# ---- B01
[[bug]]
id      = "B01"
patch   = "B01_full_msb_only.patch"
title   = "Full compare inverts only the MSB"
[bug.predict]
static      = "no"
cdc         = "no"
sim_sb      = "stim"
sim_sva     = "stim"
formal      = "e2e"
prove       = "fail"
covers_lost = []
why = """Full asserts at fill 31 - 2*rbin (mod 32): from rbin = 0 never, so the 17th write of a
fill overflows (SB_OVERFLOW, F12_CAPACITY, SMOKE; ast_F06/ast_F12). thrash_empty keeps fill <= 1,
where the bug only shows as an early full at rbin 15 or 31, which no UVM check flags and
ast_F08_wfull_exact sees only if reads pause 3 wclk edges then: stim in both columns. Formal:
ast_F12_capacity fails at the 5th write from reset."""

# ---- B02
[[bug]]
id      = "B02"
patch   = "B02_full_no_invert.patch"
title   = "Full compare without inversion (empty-style)"
[bug.predict]
static      = "no"
cdc         = "no"
sim_sb      = "yes"
sim_sva     = "yes"
formal      = "e2e"
prove       = "fail"
covers_lost = []
why = """wfull rises whenever the writer idles at (synchronized) fill 0 and then never falls, or
the writer overflows at fill 16: every test either overflows (SB_OVERFLOW) or stalls (SMOKE,
F12_CAPACITY, stall guards, S5_SHORT). With SVA, ast_F12_capacity / ast_F08_wfull_exact fire at
the first idle edge. Formal: ast_F12_capacity at the first idle wclk edge after reset."""

# ---- B03
[[bug]]
id      = "B03"
patch   = "B03_write_ignores_full.patch"
title   = "Memory write enable ignores wfull"
[bug.predict]
