# flow.toml — block-specific settings for the MCY flow (M9), read by common/scripts/mcy_run.py,
# which turns them into each project's flow.json for common/scripts/mcy_task.py. Paths are
# relative to this file.

# Simulation test: the simulator layer, the run list (generated by `make mcy-pick`, which also
# leaves the baseline logs the gate compares against), and the per-run wall-clock limit. The
# slowest baseline run at ASIZE=2 sets the limit (see sim_runs.toml); a timeout is retried once
# at three times the limit before it counts as a hang (DEC-014 D5).
[sim]
simulator = "verilator"
patterns  = "../../../common/sim/verilator.patterns"
runs      = "sim_runs.toml"
baseline  = "mcy_base"   # under OUT: the regression sim_runs.toml was picked from
timeout_s = 20

# Formal tests: the .sby template, its sources besides the mutated netlist, and the SBY timeout.
# Both use ABC PDR (DEC-014): unbounded, so a PASS is a proof and a FAIL has a trace.
[formal.test_eq]
sby       = "test_eq/test_eq.sby"
files     = ["test_eq/miter.sv", "../sva/async_fifo_e2e_props.sv"]
timeout_s = 1800

[formal.test_fm]
sby       = "test_fm/test_fm.sby"
files     = ["test_fm/fm_top.sv", "../sva/async_fifo_e2e_props.sv"]
timeout_s = 1800

# Report: the dispositions file (one entry per mutant that some method missed) and the page the
# real-RTL run writes.
[report]
triage = "triage.toml"
page   = "../docs/mutation_report.md"

# Cells memory_map creates carry no source location: the report places them at the RTL statement
# (a regex on the RTL text) of the first cell-name fragment that matches, in this order.
[report.cells]
rdmux  = 'assign\s+rdata\s*='
memory = 'mem\[.*<='
